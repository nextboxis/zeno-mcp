[package]
name = "zeno-mcp"
version = "0.5.0"
edition = "2024"
authors = ["Autonomous Systems Architect"]
description = "⚡ Zeno MCP: 100% Pure Native Rust High-Performance MCP Harness & Autonomous Agent Engine."
license = "MIT"

[dependencies]
tokio = { version = "1.40", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
clap = { version = "4.5", features = ["derive"] }
colored = "2.1"
anyhow = "1.0"
regex = "1.10"
walkdir = "2.5"
chrono = "0.4"
async-trait = "0.1"

[[bin]]
name = "zeno"
path = "src/main.rs"
